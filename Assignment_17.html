<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation</title>
  <style>
    input { display:block; margin:10px 0; padding:6px; }
  </style>
</head>
<body>
  <form action="submit.php" method="post">
    <input type="text" name="fullname" placeholder="Full name" required>

    <input type="email" name="email" placeholder="you@college.edu" required>

    <input type="text" name="mobile" placeholder="10-digit mobile"
      pattern="[0-9]{10}" title="Enter exactly 10 digits" required>

    <input type="password" name="password" placeholder="Min 6 characters"
      minlength="6" required>

    <input type="number" name="age" placeholder="Age (17-30)"
      min="17" max="30" required>

    <button type="submit">Register</button>
  </form>
</body>
</html>
