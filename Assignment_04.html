<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic and Non-Semantic Elements</title>
  <style>
    body { font-family:Arial,sans-serif; margin:30px; }
    header, nav, main, footer { margin-bottom:15px; }
    nav a { margin-right:12px; }
    .layout { border:1px solid #aaa; padding:12px; margin-top:20px; }
  </style>
</head>
<body>
  <header>
    <h1>College Portal</h1>
  </header>
  <nav aria-label="Main navigation">
    <a href="#home">Home</a> |
    <a href="#courses">Courses</a>
  </nav>
  <main id="home">
    <h2>Admission Open</h2>
    <p>Apply before 30 June.</p>
    <p id="courses">Explore our courses and facilities.</p>
  </main>
  <footer>
    <p>Notice: Library closed Sunday.</p>
    <p>&copy; 2026 College</p>
  </footer>

  <div class="layout">
    <h2>Same layout using non-semantic div elements</h2>
    <div><strong>Header:</strong> College Portal</div>
    <div><strong>Navigation:</strong> Home | Courses</div>
    <div><strong>Content:</strong> Admission Open</div>
    <div><strong>Footer:</strong> &copy; 2026 College</div>
  </div>
</body>
</html>
