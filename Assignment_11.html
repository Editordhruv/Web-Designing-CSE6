<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Page</title>
  <style>
    body { font-family:Arial,sans-serif; margin:25px; }
    a:focus, input:focus, button:focus { outline:3px solid orange; }
  </style>
</head>
<body>
  <a href="#main">Skip to main content</a>
  <nav aria-label="Main navigation">
    <a href="#home">Home</a>
    <a href="#help">Help</a>
  </nav>
  <main id="main">
    <h1 id="home">Accessible Page</h1>
    <img src="https://placehold.co/120x70?text=Logo"
         alt="College logo" width="120">
    <form role="search" aria-label="Website search">
      <label for="search">Search:</label>
      <input type="search" id="search" name="search">
      <button type="submit" aria-label="Submit search">Search</button>
    </form>
    <p id="help">Use the navigation links to explore this page.</p>
  </main>
</body>
</html>
