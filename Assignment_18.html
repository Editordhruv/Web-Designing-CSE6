<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC College Admission 2026</title>
  <style>
    body { font-family:Arial,sans-serif; margin:0; background:#f4f4f4; }
    header, footer { background:#202b80; color:white; text-align:center; padding:12px; }
    main { max-width:650px; margin:20px auto; padding:18px; background:white; }
    table { border-collapse:collapse; width:100%; margin-bottom:18px; }
    th, td { border:1px solid #aaa; padding:7px; text-align:left; }
    label { display:block; margin-top:10px; }
    input, select, textarea { width:100%; max-width:420px; padding:7px; box-sizing:border-box; }
    button { margin-top:12px; padding:8px 16px; }
  </style>
</head>
<body>
  <header>
    <h1>ABC College Admission 2026</h1>
  </header>

  <main>
    <section aria-labelledby="courses-heading">
      <h2 id="courses-heading">Courses and Fees</h2>
      <table>
        <caption>Available Courses</caption>
        <thead>
          <tr><th scope="col">Course</th><th scope="col">Seats</th><th scope="col">Fees</th></tr>
        </thead>
        <tbody>
          <tr><td>B.Tech</td><td>120</td><td>₹90,000</td></tr>
          <tr><td>BCA</td><td>60</td><td>₹40,000</td></tr>
        </tbody>
      </table>
    </section>

    <section aria-labelledby="application-heading">
      <h2 id="application-heading">Application Form</h2>
      <form action="#" method="post">
        <label for="student-name">Name</label>
        <input type="text" id="student-name" name="name" required>

        <label for="student-email">Email</label>
        <input type="email" id="student-email" name="email" required>

        <label for="student-course">Course</label>
        <select id="student-course" name="course" required>
          <option value="">Select a course</option>
          <option value="BTech">B.Tech CSE</option>
          <option value="BCA">BCA</option>
        </select>

        <label for="statement">Statement</label>
        <textarea id="statement" name="statement" rows="4"
          placeholder="Write a short statement"></textarea>

        <button type="submit">Apply</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 ABC College</p>
  </footer>
</body>
</html>
