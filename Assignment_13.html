<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Timetable</title>
  <style>
    table { border-collapse:collapse; text-align:center; }
    th, td { border:1px solid #555; padding:10px; }
  </style>
</head>
<body>
  <table>
    <caption>Weekly Timetable</caption>
    <thead>
      <tr><th>Day</th><th>9-10</th><th>10-11</th><th>11-12</th></tr>
    </thead>
    <tbody>
      <tr><th>Mon</th><td>Maths</td><td>HTML</td><td rowspan="2">Web Lab</td></tr>
      <tr><th>Tue</th><td>DBMS</td><td>OS</td></tr>
      <tr><th>Wed</th><td colspan="3">Seminar</td></tr>
    </tbody>
  </table>
</body>
</html>
