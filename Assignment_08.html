<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links and Images</title>
</head>
<body>
  <h2 id="top">Links demo</h2>
  <p><a href="https://www.google.com" target="_blank" rel="noopener">External link</a></p>
  <p><a href="#bottom">Jump to bottom</a></p>
  <p><a href="mailto:admin@example.com">Email us</a></p>
  <p>
    <a href="https://www.example.com" target="_blank" rel="noopener">
      <img src="https://placehold.co/120x70?text=Logo"
           alt="College logo" width="120" height="70">
    </a>
  </p>
  <p id="bottom">Bottom. <a href="#top">Back to top</a></p>
</body>
</html>
